<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teste de Filosofia</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2330;--mu:#5f6578;--ac:#3b4cca;--ok:#1b7f4b;--okb:#e3f5ea;--er:#b3261e;--erb:#fdeceb;--bd:#d9d6cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171e;--card:#1e212b;--tx:#eceef5;--mu:#a2a7ba;--ac:#8d9bff;--ok:#6fd6a0;--okb:#17352a;--er:#ff9b93;--erb:#3d1d1b;--bd:#343848}}
:root[data-theme="dark"]{--bg:#15171e;--card:#1e212b;--tx:#eceef5;--mu:#a2a7ba;--ac:#8d9bff;--ok:#6fd6a0;--okb:#17352a;--er:#ff9b93;--erb:#3d1d1b;--bd:#343848}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,'Times New Roman',serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px}
h1{font-size:1.9rem;margin:.2em 0}h2{font-size:1.2rem;margin:.2em 0 .8em;line-height:1.4}p{color:var(--mu)}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:12px 22px;font-weight:700}
.btn.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;margin:8px 0}
.opt:hover:not(:disabled){border-color:var(--ac)}.opt b{color:var(--ac)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.er{background:var(--erb);border-color:var(--er)}
.fb{margin-top:14px;padding:14px;border-radius:10px;border-left:5px solid}
.fb.ok{background:var(--okb);border-color:var(--ok)}.fb.er{background:var(--erb);border-color:var(--er)}
.fb p{color:var(--tx);margin:.4em 0}.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem;margin-bottom:10px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%}
.hide{display:none}.big{font-size:2.6rem;font-weight:700}
</style></head><body><main>
<section id="home" class="card"><h1>📚 Teste de Filosofia</h1><p>Teste seus conhecimentos com questões elaboradas a partir das suas aulas e slides.</p><button class="btn" onclick="show('case')">Realizar case</button></section>
<section id="case" class="card hide"><h1>Teste de Filosofia</h1><p>O teste sorteia 10 questões de um banco de 50. Cada uma tem alternativas de A a E, com dica e explicação a cada resposta.</p><button class="btn" onclick="start()">Iniciar quiz</button> <button class="btn s" onclick="show('home')">Voltar</button></section>
<section id="quiz" class="card hide"><div class="top"><span id="n"></span><span id="sc"></span></div><div class="bar"><i id="pb" style="background:var(--ac)"></i></div><h2 id="q"></h2><div id="o"></div><div id="fb"></div><p><button class="btn hide" id="nx" onclick="next()">Próxima</button></p></section>
<section id="res" class="card hide"><h1>Resultado final</h1><div class="big" id="pc"></div><p id="rt"></p><div class="bar"><i id="rb" style="background:var(--ok)"></i></div><p id="rs"></p><button class="btn" onclick="start()">Novo quiz</button> <button class="btn s" onclick="show('home')">Início</button></section>
</main><script>
// [enunciado, CORRETA, errada1..4, explicação, dica]  (alternativas são embaralhadas de A a E)
const B=[
["O que caracteriza um conhecimento técnico?","Serve a outra coisa que não a ele mesmo","É buscado por amor ao próprio saber","Não tem nenhuma aplicação prática","Foi inventado pelos gregos como ciência pura","É cultivado só para aumentar a sabedoria","O saber técnico é um meio para outro fim (ex.: saber fazer um bolo só faz sentido se o bolo for feito).","Pergunte: o saber é meio (técnica) ou fim em si mesmo (filosofia/ciência)?"],
["Onde e há quanto tempo surgiram a Filosofia e a Ciência, segundo a Aula 1?","Na Grécia antiga, há quase três mil anos","No Egito antigo, junto da astrologia","Na Roma imperial","Na Idade Média cristã","Na Mesopotâmia, com a escrita","Egípcios tinham matemática e astronomia, mas como técnicas; foram os gregos que as cultivaram por elas mesmas.","Grécia = conhecimento por si mesmo; Egito = conhecimento para fins práticos."],
["Para que os egípcios utilizavam a Matemática e a Astronomia?","Matemática para medir terrenos; astronomia a serviço da astrologia","Para fundar a ciência pura","Para investigar a natureza do ser","Para criticar os mitos","Apenas para fins religiosos sem uso prático","Eram conhecimentos técnicos: serviam a fins diferentes deles mesmos.","Lembre da dupla: terrenos + astrologia = técnica."],
["Quem é considerado o primeiro filósofo e o primeiro cientista?","Tales de Mileto","Sócrates","Platão","Aristóteles","Pitágoras","Tales previu um eclipse e perguntou pela natureza do mundo físico, sendo filósofo e cientista ao mesmo tempo.","Primeiro = Tales, de Mileto (escola jônica)."],
["O episódio de Tales comprando prensas de azeitonas mostra que o conhecimento filosófico/científico...","Mesmo não buscado por utilidade, confere grande vantagem a quem o tem","Serve apenas para enriquecer","É inútil e não traz vantagem","É só técnica de comércio","Deve ser abandonado quando não é útil","Tales previu a safra pela astronomia e ficou rico, embora o saber não fosse buscado por utilidade.","Utilidade é consequência, não objetivo, do saber filosófico."],
["A frase \"a Filosofia não serve PARA nada\" (Aristóteles, Metafísica) significa que a filosofia...","Não é serva de coisa alguma: é cultivada por amor ao conhecimento","É inútil e dispensável","Não tem nenhuma vantagem","Serve só à religião","Existe apenas para fins comerciais","Aristóteles diz que a filosofia não é serva (escrava) de nada; não que seja inútil.","\"Não serve A nada\" ≠ \"não serve PARA nada\"."],
["Qual filósofo disse que \"conhecimento é poder\"?","Francis Bacon","Isaac Newton","Tales de Mileto","Aristóteles","Platão","Bacon, autor do Novum Organum, defendeu que o conhecimento é a verdadeira riqueza.","Bacon = poder; Newton = gravitação."],
["Qual foi a resposta de Tales sobre o elemento fundamental do mundo, e por que ela é importante?","Água; a pergunta racional sobre a natureza é o mais importante","Fogo; a resposta está correta","Ar; explicou o mito","Átomos; fundou a física","Números; fundou a matemática","A resposta (água) está equivocada, mas a pergunta racional, que substituiu o mito, é original e profunda.","Na Aula 1, o valor está na pergunta, não na resposta."],
["Para Anaximandro, o princípio de todas as coisas é...","Uma matéria sem forma, indeterminada (ápeiron)","A água","O ar","O fogo","Os números","Anaximandro propôs uma substância indeterminada da qual tudo sai e para onde tudo volta.","Anaximandro = ápeiron (infinito/indeterminado)."],
["Segundo Pitágoras, o que são as verdadeiras realidades que não mudam?","Os números","Os átomos","O fogo","A água","O ar","Para Pitágoras o mundo é regido por combinações de números.","Pitágoras = números."],
["Qual ideia é central em Heráclito de Éfeso?","Tudo flui; o mundo está em eterna mudança e o fogo é o princípio","O ser é imóvel e eterno","O princípio de tudo é a água","Tudo é feito de átomos idênticos","O homem é a medida de todas as coisas","Heráclito é o filósofo do devir: nada é estável, tudo se move.","Heráclito = fluxo/devir = fogo."],
["Qual tese é atribuída a Parmênides de Eléia?","O ser é e o não-ser não é; a mudança é ilusão dos sentidos","Tudo flui","O princípio é o fogo","O princípio é o ar","Existem tantas verdades quantas mentes","Parmênides vê o Ser como eterno, imóvel, pleno e indivisível; a multiplicidade é ilusão.","Parmênides é o oposto de Heráclito: imobilidade."],
["Para Demócrito de Abdera, qual é o princípio do mundo?","Conjuntos de átomos","Os quatro elementos","A água","O fogo","O Um","Demócrito defendia que tudo, inclusive o homem, é composto de átomos.","Demócrito → átomo."],
["Qual doutrina é de Empédocles?","Os quatro elementos (ar, água, fogo, terra) movidos por Amor e Ódio","Apenas o ar como princípio","Os números como realidade","A maiêutica","A teoria das ideias","Empédocles unia os quatro elementos com as forças contrárias do Amor e do Ódio.","Empédocles = 4 elementos + Amor × Ódio."],
["Para os sofistas, como se entende a verdade?","Existem tantas verdades quanto mentes humanas","Há uma única verdade absoluta","A verdade está nas Ideias eternas","A verdade é o fogo","A verdade é dada por Deus","Cada povo tem crenças e costumes próprios, daí o relativismo sofista.","Sofistas = relativismo + argumentação."],
["A máxima de Protágoras \"o homem é a medida de todas as coisas\" expressa que...","O ser humano não deve se moldar a padrões externos, mas à própria liberdade","As coisas são medidas por Deus","Os números medem o mundo","O fogo mede o mundo","A natureza é a medida do homem","A máxima coloca o ser humano como critério, não padrões impostos de fora.","Protágoras = homem como medida."],
["O que os sofistas ensinavam, cobrando por isso?","Estratégias de argumentação e a arte de fazer política","A física dos átomos","A teoria das ideias","A astronomia técnica","O estoicismo","Ensinavam a falar em público e a argumentar, uma pedagogia voltada à vida prática.","Sofistas = ensino pago de retórica."],
["O que Sócrates mudou na filosofia grega?","Passou o foco da natureza para o homem e suas ações","Voltou a estudar apenas a natureza","Fundou a ciência experimental","Defendeu o relativismo sofista","Ensinou o princípio da água","Sócrates reformulou a filosofia, que antes se centrava na natureza, para ocupar-se do homem.","Pré-socráticos = natureza; Socráticos = homem."],
["Na maiêutica, Sócrates...","Instiga diálogos críticos para que a pessoa encontre as respostas por conta própria","Entrega respostas prontas","Ensina técnicas de oratória pagas","Defende a verdade relativa","Usa o silogismo","A maiêutica leva o interlocutor a refletir e encontrar as respostas por si.","Maiêutica = \"parto de ideias\" por meio do diálogo."],
["Para Platão, qual é a primeira virtude do filósofo?","Admirar-se","Calcular","Obedecer","Enriquecer","Persuadir","Para Platão a filosofia começa no espanto e na admiração diante do mundo.","Platão: filosofia nasce do espanto."],
["Na Teoria das Ideias de Platão, o mundo físico é...","Sombra ou cópia imperfeita do mundo das Ideias eternas e imutáveis","A realidade mais verdadeira","Feito só de átomos","Feito de água","Idêntico ao mundo das Ideias","Para Platão a verdade reside nas Ideias; o sensível é cópia imperfeita.","Ideias = verdadeiro; sensível = sombra."],
["Quem fundamentou a lógica e estabeleceu o silogismo?","Aristóteles","Platão","Sócrates","Tales","Heráclito","Aristóteles sistematizou a lógica formal e o raciocínio dedutivo.","Silogismo → Aristóteles."],
["Qual característica marca a Filosofia Medieval?","Busca de conciliar verdades da fé e da razão; teocentrismo","Antropocentrismo e separação entre fé e razão","Superação do mito pela razão","Secularização da consciência","Pluralismo de ideias","A medieval concilia fé e razão e tem Deus no centro (teocentrismo).","Medieval = Deus no centro; Moderna = homem no centro."],
["Qual característica define a Filosofia Moderna (séc. XVI–XVIII)?","Confiança na razão, antropocentrismo e separação entre fé e razão","Teocentrismo","Superação do mito","Conciliação entre fé e razão","Escolas morais helenísticas","A moderna rejeita o passado, desenvolve a crítica e confia na razão.","Moderna = razão + homem."],
["Qual conjunto de características marca a Filosofia Contemporânea?","Pluralismo de ideias, historicidade, secularização e antidogmatismo","Teocentrismo e dogmatismo","Superação do mito","Busca do princípio originário (arché)","Conciliação fé e razão","Entre os traços da contemporânea estão pluralismo e antidogmatismo.","Contemporânea = pluralidade, sem dogmas."],
["O que os pré-socráticos investigavam?","Questões da natureza, como o princípio originário (arché)","A ética e a política","A fé cristã","A moral helenística","O livre-arbítrio","Buscavam o arché e as leis do universo.","Pré-socrático = natureza/arché."],
["O que marca o período Helenístico?","Escolas morais em busca de uma moral adequada à felicidade humana","A busca do arché","A escolástica","O racionalismo cartesiano","O criticismo kantiano","Epicurismo, estoicismo, ceticismo e outras escolas buscaram a felicidade.","Helenismo = ética e felicidade."],
["O que ensinava Epicuro?","Prazer e ausência de dor como objetivos principais","A virtude como único bem, com Zenão","Tudo flui","A maiêutica","As cinco vias","Epicuro fundou o Epicurismo, centrado no prazer e na ausência de dor.","Epicuro → prazer."],
["O Estoicismo foi fundado por...","Zenão de Cítio, que defendia a virtude","Epicuro, que defendia o prazer","Pirro","Sócrates","Descartes","Zenão fundou o Estoicismo, que defende a virtude como o bem.","Estoicismo → Zenão → virtude."],
["O que a epistemologia opõe com os termos epistêmê e doxa?","Conhecimento e opinião","Corpo e alma","Fé e razão","Ser e devir","Bem e mal","Epistêmê é conhecimento; doxa, opinião, que pode ser falsa.","Epistêmê = saber; doxa = opinião."],
["Quais condições são aceitas, em geral, para haver conhecimento (sentido proposicional)?","Crença verdadeira e justificada","Apenas crença","Apenas opinião","Apenas experiência sensível","Apenas autoridade","Não há conhecimento sem crença; ela deve ser verdadeira e justificada.","Conhecimento = crença + verdade + justificação."],
["Qual par de correntes se opõe sobre a origem do conhecimento?","Empirismo (experiência) e racionalismo (razão)","Estoicismo e epicurismo","Idealismo e cinismo","Escolástica e patrística","Sofística e maiêutica","Empiristas (Locke, Hume, Berkeley) × racionalistas (Descartes, Leibniz).","Empirismo = experiência; racionalismo = razão."],
["Qual é a posição de Kant na teoria do conhecimento?","O conhecimento depende da matéria dos sentidos e das formas a priori do pensamento","Só a experiência fornece conhecimento","Só a razão fornece conhecimento","O conhecimento é impossível","Conhecimento é revelação","Kant, pelo criticismo, supera tanto empirismo quanto racionalismo tradicional.","Kant = síntese: sentidos + formas a priori."],
["O conhecimento é entendido como uma relação entre...","Sujeito e objeto","Fé e razão","Corpo e alma","Mito e logos","Bem e mal","A teoria do conhecimento estuda essa relação sujeito–objeto.","Sempre dois polos: sujeito e objeto."],
["Quem estabeleceu a dúvida e o \"Penso, logo existo\"?","Descartes","John Locke","Kant","Santo Agostinho","Platão","Descartes é o racionalista da dúvida metódica e do cogito.","Descartes → cogito."],
["Segundo Savater, citado em Ensino de Filosofia, o que há na filosofia?","Não existe \"a\" filosofia, mas \"as\" filosofias e o filosofar","Uma única filosofia verdadeira","Apenas respostas definitivas","Apenas técnica","Só ciência","A filosofia tem perspectiva multifacetada: várias filosofias e sobretudo o filosofar.","\"As\" filosofias, não \"a\" filosofia."],
["Segundo o slide sobre aprendizibilidade, qual afirmação é correta?","Pode haver métodos para ensinar, mas não há método para aprender","Há método garantido para aprender","Aprender é simples","O filósofo já saiu da caverna","Aprender é tarefa finita","O filósofo é sempre um aprendiz, como quem descobre sua condição na caverna.","Ensinar tem método; aprender escapa do controle."],
["Segundo Savater, aprender a perguntar bem também é...","Desconfiar de respostas demasiado taxativas","Aceitar respostas absolutas","Evitar perguntas gerais","Memorizar sistemas","Copiar autores","Em questões gerais, perguntar bem é aprender a desconfiar de respostas taxativas.","Perguntar bem > responder rápido."],
["Quais são os 5 argumentos de Tomás de Aquino para a existência de Deus?","Cinco vias: movimento, causa eficiente, contingência, graus de perfeição e finalidade","Cogito, dúvida, método, evidência e análise","Maiêutica, ironia, dialética, ideia e alma","Fé, esperança, caridade, graça e livre-arbítrio","Água, ar, fogo, terra e átomos","São as cinco vias expostas na Suma Teológica.","Memorize: movimento, causa, contingência, perfeição, finalidade."],
["Na primeira via (movimento), a conclusão é...","Existe um motor imóvel, causa primeira de todo movimento, identificado como Deus","O movimento é infinito","O movimento é ilusão","Tudo flui","Nada se move","Não pode haver cadeia infinita de movimentos; deve haver um primeiro motor imóvel.","1ª via → motor imóvel."],
["A segunda via de Tomás (causa eficiente) conclui que...","Há uma causa primeira não causada por nada anterior","As causas são infinitas","Nada tem causa","O acaso explica tudo","Só a matéria existe","Seguindo a cadeia de causas chega-se a uma causa primeira, fonte do ser.","2ª via → causa primeira."],
["Na terceira via, o ser necessário é aquele...","Cuja existência não depende de nada além de si mesmo","Cuja existência depende de outros","Que é contingente","Que é mais imperfeito","Que se move","Seres contingentes dependem de outros; o necessário é causa última de tudo.","Contingente depende; necessário não."],
["A quarta via de Tomás parte...","Dos graus de perfeição observados nas coisas","Do movimento","Da causa eficiente","Da finalidade","Da dúvida cartesiana","Perceber coisas mais e menos perfeitas leva a um ser supremo, fonte de toda perfeição.","4ª via → graus de perfeição."],
["A quinta via de Tomás defende que a ordem e finalidade da natureza...","Não resultam do acaso; exigem um ser inteligente que dirige o universo","São produto do acaso","Provam que Deus não existe","Dependem da experiência","São ilusões","Cada elemento parece ter propósito, sugerindo um ser inteligente.","5ª via → finalidade → inteligência ordenadora."],
["Quem foi Santo Agostinho, e qual influência filosófica ele recebeu?","Filósofo e teólogo (354 d.C.), influenciado por Platão e pelo neoplatonismo","Aristotélico do século XIII","Cartesiano do século XVII","Estoico romano pagão","Sofista grego","Nascido em Tagaste, autor de Confissões e A Cidade de Deus, foi marcado pelo platonismo.","Agostinho (séc. IV/V) → Platão; Tomás (séc. XIII) → Aristóteles."],
["Como Agostinho entende a relação entre fé e razão?","Complementares: a fé guia a razão e a razão aprofunda a fé","Opostas e inconciliáveis","A razão elimina a fé","A fé dispensa o pensamento","Só a razão importa","Para ele a fé precede e fundamenta a razão, que ajuda a compreendê-la.","Fé e razão: síntese, não oposição."],
["Para Santo Agostinho, o livre-arbítrio é...","A capacidade da vontade de escolher entre bem e mal, apoiada pela graça divina","Poder escolher sem nenhuma responsabilidade","Algo que a razão elimina","Dependente apenas da lei natural","Inexistente","O pecado original é uma barreira e a graça um suporte; a escolha é a base da responsabilidade moral.","Agostinho → graça; Tomás → razão e lei natural."],
["Como Santo Tomás de Aquino fundamenta o livre-arbítrio?","Na razão e na lei natural, ligado à busca do bem","Só na graça divina","No ceticismo","No acaso","No materialismo","Para Tomás a escolha moral é essencial à liberdade e se apoia na razão e na lei natural.","Tomás = razão + lei natural."],
["Qual filósofo propôs o empirismo, afirmando que todo conhecimento vem da experiência?","John Locke","René Descartes","Platão","Parmênides","Santo Agostinho","Locke defende que o conhecimento provém da experiência sensível, ao lado de Hume e Berkeley.","Empirismo → experiência (Locke, Hume, Berkeley)."],
["Qual campo da filosofia investiga a natureza da mente e o problema mente-corpo?","Filosofia da mente","Estética","Filosofia política","Ética","Lógica","Estuda consciência, dualismo e fisicalismo e a relação mente–corpo.","Mente-corpo → filosofia da mente."]
];
const $=id=>document.getElementById(id);let Q=[],i=0,hit=0,done=false;
function show(s){["home","case","quiz","res"].forEach(x=>$(x).classList.toggle("hide",x!==s))}
function sh(a){a=a.slice();for(let k=a.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function start(){Q=sh(B).slice(0,10);i=0;hit=0;show("quiz");render()}
function render(){done=false;const d=Q[i];const o=sh([0,1,2,3,4].map(k=>({t:d[1+k],c:k===0})));d.o=o;
$("n").textContent="Questão "+(i+1)+" de 10";$("sc").textContent="Acertos: "+hit;$("pb").style.width=(i/10*100)+"%";
$("q").textContent=d[0];$("fb").innerHTML="";$("nx").classList.add("hide");
$("o").innerHTML="";o.forEach((x,k)=>{const b=document.createElement("button");b.className="opt";b.innerHTML="<b>"+"ABCDE"[k]+")</b><span></span>";b.lastChild.textContent=x.t;b.onclick=()=>ans(k);$("o").appendChild(b)})}
function ans(k){if(done)return;done=true;const d=Q[i],bs=$("o").children,right=d.o.findIndex(x=>x.c);
[...bs].forEach((b,j)=>{b.disabled=true;if(j===right)b.classList.add("ok")});
let h;if(k===right){hit++;bs[k].classList.add("ok");h='<div class="fb ok"><b>✅ Muito bem!</b><p>'+d[6]+'</p><p><b>💡 Dica para não errar mais:</b> '+d[7]+'</p></div>'}
else{bs[k].classList.add("er");h='<div class="fb er"><b>❌ Incorreta.</b><p><b>Por quê:</b> a alternativa '+"ABCDE"[k]+' está errada. A correta é a '+"ABCDE"[right]+'. '+d[6]+'</p><p><b>💡 Dica para não errar mais:</b> '+d[7]+'</p></div>'}
$("fb").innerHTML=h;$("sc").textContent="Acertos: "+hit;const n=$("nx");n.textContent=i===9?"Ver resultado":"Próxima";n.classList.remove("hide")}
function next(){if(i===9){fin()}else{i++;render()}}
function fin(){show("res");const p=hit*10;$("pc").textContent=p+"% de acertos";$("rt").textContent="✅ Acertos: "+hit+" ("+p+"%)   |   ❌ Erros: "+(10-hit)+" ("+(100-p)+"%)";$("rb").style.width=p+"%";
$("rs").textContent=p>=80?"Excelente! Você domina o conteúdo.":p>=60?"Bom desempenho! Revise os pontos das dicas.":"Continue estudando: refaça o case e revise as aulas."}
</script></body></html>
